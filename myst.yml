version: 1
project:
  license: CC-BY-NC-SA-4.0
  title: Introduction to Statistics
  authors:
    - name: City College of San Francisco 
  exclude:
    - README.md
    - STYLE_GUIDE.md
    - PROGRESS.md
    - unsorted_pages/*.md
    - _toc.yml
    - pages/unused/*.md
    - pages/*m01*.md
    - pages/*m02*.md
  plugins:
    - pages/quiz.mjs
  # Abbreviations get a hover-tooltip and an <abbr> tag wherever the exact
  # uppercase string appears in prose. They are case-sensitive and are NOT
  # applied inside code blocks, math, links, or cross-references. Longer keys
  # win over shorter ones that share a suffix; set a key to `null` to suppress
  # an unwanted expansion (see the guards at the bottom of the list).
  abbreviations:
    ANOVA: Analysis of Variance
    CI: Confidence Interval
    CLT: Central Limit Theorem
    EDA: Exploratory Data Analysis
    IQR: Interquartile Range
    SD: Standard Deviation
    SE: Standard Error
    SRS: Simple Random Sample
    # Guards. Abbreviation matching is case-sensitive but NOT word-bounded, so
    # any all-caps word in the prose that merely *contains* one of the keys
    # above would be mangled (e.g. OB-SE-RVED). These are the all-caps
    # emphasis words currently in the book that contain "SE"; re-run
    # the audit in this file's git history if you add more shouty emphasis.
    INCREASE: null
    INCREASED: null
    DECREASES: null
    OBSERVED: null
    ROSE: null
  # Give every page a flat, stable page number (1, 2, 3, ...) following
  # toc.yml reading order. The number renders in the sidebar and page title so
  # instructors can say "open page 30" in class and students land in one place.
  # `offset: 0` keeps numbering flat; without it MyST nests it as "1.1.28",
  # because the Unit/Section headings in toc.yml are labels, not pages.
  # Page numbers shift if pages are added, removed, or reordered; re-run
  # scripts/make_page_index.py afterwards to refresh the instructor index.
  numbering:
    title:
      enabled: true
      offset: 0
      enumerator: "%s."

extends:
  - toc.yml

site:
  options:
    folders: true
    logo: ccsf.png
    favicon: favicon.ico
    logo_text: "Introduction to Statistics"
    analytics_google: G-2QP7TPFF21
  template: book-theme

