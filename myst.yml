version: 1
project:
  license: CC-BY-NC-SA-4.0
  title: Introduction to Statistics
  authors:
    - name: City College of San Francisco 
  exclude:
    - README.md
    - STYLE_GUIDE.md
    - PROGRESS.md
    - unsorted_pages/*.md
    - _toc.yml
    - pages/unused/*.md
    - pages/*m01*.md
    - pages/*m02*.md
  plugins:
    - pages/quiz.mjs

extends:
  - toc.yml

site:
  options:
    folders: true
    logo: ccsf.png
    favicon: favicon.ico
    logo_text: "Introduction to Statistics"
  template: book-theme
  #hide_toc: true

