<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" fill="#333333">
  <text x="320" y="24" text-anchor="middle" font-size="15" font-weight="bold">Adding or Subtracting a Constant Shifts the Distribution, but Not Its Spread</text>
  <!-- Original X -->
  <g fill="#7cb2e8" stroke="#2b6cb0" stroke-width="1">
    <rect x="61" y="180" width="16" height="20"/><rect x="79" y="180" width="16" height="20"/>
    <rect x="97" y="80" width="16" height="120"/><rect x="115" y="180" width="16" height="20"/>
    <rect x="133" y="180" width="16" height="20"/>
  </g>
  <line x1="40" y1="200" x2="170" y2="200" stroke="#333333" stroke-width="1.5"/>
  <g font-size="11" text-anchor="middle">
    <text x="69" y="215">-2</text><text x="105" y="215">0</text><text x="141" y="215">2</text>
  </g>
  <text x="105" y="240" text-anchor="middle" font-size="13" font-weight="bold">X: &#956; = 0, &#963; = 1</text>
  <!-- X + 6 -->
  <g fill="#2f855a" fill-opacity="0.55" stroke="#2f855a" stroke-width="1">
    <rect x="276" y="180" width="16" height="20"/><rect x="294" y="180" width="16" height="20"/>
    <rect x="312" y="80" width="16" height="120"/><rect x="330" y="180" width="16" height="20"/>
    <rect x="348" y="180" width="16" height="20"/>
  </g>
  <line x1="255" y1="200" x2="385" y2="200" stroke="#333333" stroke-width="1.5"/>
  <g font-size="11" text-anchor="middle">
    <text x="284" y="215">4</text><text x="320" y="215">6</text><text x="356" y="215">8</text>
  </g>
  <text x="320" y="240" text-anchor="middle" font-size="13" font-weight="bold">X + 6: &#956; = 6, &#963; = 1</text>
  <!-- X - 7 -->
  <g fill="#dd6b20" fill-opacity="0.55" stroke="#dd6b20" stroke-width="1">
    <rect x="491" y="180" width="16" height="20"/><rect x="509" y="180" width="16" height="20"/>
    <rect x="527" y="80" width="16" height="120"/><rect x="545" y="180" width="16" height="20"/>
    <rect x="563" y="180" width="16" height="20"/>
  </g>
  <line x1="470" y1="200" x2="600" y2="200" stroke="#333333" stroke-width="1.5"/>
  <g font-size="11" text-anchor="middle">
    <text x="499" y="215">-9</text><text x="535" y="215">-7</text><text x="571" y="215">-5</text>
  </g>
  <text x="535" y="240" text-anchor="middle" font-size="13" font-weight="bold">X &#8722; 7: &#956; = &#8722;7, &#963; = 1</text>
</svg>
