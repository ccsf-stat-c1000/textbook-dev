<svg viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" fill="#333333">
  <text x="340" y="26" text-anchor="middle" font-size="18" font-weight="bold">Body Image of U.S. College Students</text>
  <!-- gridlines -->
  <g stroke="#dddddd" stroke-width="1">
    <line x1="80" y1="235" x2="600" y2="235"/>
    <line x1="80" y1="170" x2="600" y2="170"/>
    <line x1="80" y1="105" x2="600" y2="105"/>
    <line x1="80" y1="40" x2="600" y2="40"/>
  </g>
  <!-- bars -->
  <rect x="135" y="68.3" width="110" height="231.7" fill="#7cb2e8" stroke="#2b6cb0"/>
  <rect x="300" y="236.3" width="110" height="63.7" fill="#7cb2e8" stroke="#2b6cb0"/>
  <rect x="465" y="270.1" width="110" height="29.9" fill="#7cb2e8" stroke="#2b6cb0"/>
  <text x="190" y="60" text-anchor="middle" font-size="14" font-weight="bold">71.3%</text>
  <text x="355" y="228" text-anchor="middle" font-size="14" font-weight="bold">19.6%</text>
  <text x="520" y="262" text-anchor="middle" font-size="14" font-weight="bold">9.2%</text>
  <!-- axes -->
  <line x1="80" y1="40" x2="80" y2="300" stroke="#333333" stroke-width="1.5"/>
  <line x1="80" y1="300" x2="600" y2="300" stroke="#333333" stroke-width="1.5"/>
  <g font-size="13" text-anchor="end">
    <text x="72" y="305">0</text>
    <text x="72" y="240">20</text>
    <text x="72" y="175">40</text>
    <text x="72" y="110">60</text>
    <text x="72" y="45">80</text>
  </g>
  <g font-size="15" text-anchor="middle">
    <text x="190" y="324">About right</text>
    <text x="355" y="324">Overweight</text>
    <text x="520" y="324">Underweight</text>
  </g>
  <text x="24" y="170" font-size="16" text-anchor="middle" transform="rotate(-90 24 170)">Percent</text>
  <text x="340" y="352" font-size="16" text-anchor="middle">Body image</text>
</svg>
