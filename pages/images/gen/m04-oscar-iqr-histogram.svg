<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" fill="#333333">
  <text x="320" y="26" text-anchor="middle" font-size="17" font-weight="bold">Range vs. IQR (Ages of Best Actress Winners)</text>
  <g fill="#7cb2e8" stroke="#2b6cb0" stroke-width="1">
    <rect x="80" y="260" width="36" height="40"/>
    <rect x="116" y="140" width="36" height="160"/>
    <rect x="152" y="60" width="36" height="240"/>
    <rect x="188" y="160" width="36" height="140"/>
    <rect x="224" y="180" width="36" height="120"/>
    <rect x="260" y="220" width="36" height="80"/>
    <rect x="368" y="240" width="36" height="60"/>
    <rect x="440" y="280" width="36" height="20"/>
    <rect x="512" y="280" width="36" height="20"/>
  </g>
  <line x1="80" y1="300" x2="580" y2="300" stroke="#333333" stroke-width="1.5"/>
  <g font-size="12" text-anchor="middle">
    <text x="80" y="316">20</text><text x="152" y="316">30</text><text x="224" y="316">40</text>
    <text x="296" y="316">50</text><text x="368" y="316">60</text><text x="440" y="316">70</text><text x="512" y="316">80</text>
  </g>
  <!-- IQR bracket: 30.5 to 42 -->
  <path d="M 155.6 330 L 155.6 342 L 238.4 342 L 238.4 330" fill="none" stroke="#c53030" stroke-width="2.5"/>
  <text x="197" y="360" text-anchor="middle" font-size="14" font-weight="bold" fill="#c53030">IQR = 11.5</text>
  <!-- Range bracket: 21 to 80 -->
  <path d="M 87.2 368 L 87.2 380 L 512 380 L 512 368" fill="none" stroke="#2b6cb0" stroke-width="2.5"/>
  <text x="300" y="398" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6cb0">Range = 59</text>
</svg>
