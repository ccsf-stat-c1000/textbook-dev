<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" fill="#333333">
  <text x="160" y="26" text-anchor="middle" font-size="15" font-weight="bold">A and B are disjoint</text>
  <rect x="20" y="40" width="290" height="200" fill="none" stroke="#333333" stroke-width="2"/>
  <circle cx="105" cy="140" r="55" fill="#7cb2e8" fill-opacity="0.7" stroke="#2b6cb0" stroke-width="2"/>
  <text x="105" y="148" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff">A</text>
  <circle cx="235" cy="140" r="55" fill="#2f855a" fill-opacity="0.55" stroke="#2f855a" stroke-width="2"/>
  <text x="235" y="148" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff">B</text>
  <text x="160" y="268" text-anchor="middle" font-size="13" font-style="italic">no overlap &#8212; cannot occur together</text>
  <text x="480" y="26" text-anchor="middle" font-size="15" font-weight="bold">A and B are NOT disjoint</text>
  <rect x="340" y="40" width="290" height="200" fill="none" stroke="#333333" stroke-width="2"/>
  <circle cx="450" cy="140" r="60" fill="#7cb2e8" fill-opacity="0.7" stroke="#2b6cb0" stroke-width="2"/>
  <text x="425" y="148" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff">A</text>
  <circle cx="525" cy="140" r="60" fill="#2f855a" fill-opacity="0.55" stroke="#2f855a" stroke-width="2"/>
  <text x="550" y="148" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff">B</text>
  <text x="480" y="268" text-anchor="middle" font-size="13" font-style="italic">overlap &#8212; can occur together</text>
</svg>
