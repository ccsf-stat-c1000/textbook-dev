<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <!-- Population -->
  <circle cx="185" cy="160" r="120" fill="#7cb2e8" fill-opacity="0.35" stroke="#2b6cb0" stroke-width="2"/>
  <text x="185" y="105" text-anchor="middle" font-size="14" font-weight="bold" fill="#333333">Population of interest</text>
  <text x="185" y="145" text-anchor="middle" font-size="13" fill="#c53030">Are X and Y related</text>
  <text x="185" y="162" text-anchor="middle" font-size="13" fill="#c53030">in the population?</text>
  <!-- Arrow -->
  <line x1="310" y1="160" x2="410" y2="160" stroke="#2b6cb0" stroke-width="2"/>
  <polygon points="408,154 408,166 420,160" fill="#2b6cb0"/>
  <text x="365" y="145" text-anchor="middle" font-size="12" fill="#333333">SRS of size n</text>
  <!-- Sample -->
  <circle cx="510" cy="160" r="85" fill="#7cb2e8" stroke="#2b6cb0" stroke-width="2"/>
  <text x="510" y="145" text-anchor="middle" font-size="14" font-weight="bold" fill="#333333">Sample</text>
  <text x="510" y="168" text-anchor="middle" font-size="13" fill="#333333">data on both</text>
  <text x="510" y="185" text-anchor="middle" font-size="13" fill="#333333">X and Y</text>
  <!-- Inference arrow back -->
  <path d="M 470 250 Q 350 300 230 262" fill="none" stroke="#2f855a" stroke-width="2"/>
  <polygon points="238,257 228,270 224,258" fill="#2f855a"/>
  <text x="350" y="305" text-anchor="middle" font-size="13" fill="#2f855a">inference: do the data provide significant evidence of a relationship?</text>
</svg>
