<svg viewBox="0 0 640 280" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" fill="#333333">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#333333"/>
    </marker>
  </defs>
  <ellipse cx="170" cy="145" rx="130" ry="105" fill="#eaf2fb" stroke="#2b6cb0" stroke-width="2"/>
  <text x="170" y="125" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b6cb0">Population:</text>
  <text x="170" y="147" text-anchor="middle" font-size="15" fill="#2b6cb0">all U.S. adults</text>
  <text x="170" y="172" text-anchor="middle" font-size="13" font-style="italic" fill="#2b6cb0">% in favor = ?</text>
  <line x1="305" y1="120" x2="395" y2="105" stroke="#333333" stroke-width="2" marker-end="url(#arr)"/>
  <text x="350" y="88" text-anchor="middle" font-size="13" font-style="italic">random sample</text>
  <circle cx="475" cy="130" r="72" fill="#eaf2fb" stroke="#2b6cb0" stroke-width="2"/>
  <text x="475" y="112" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b6cb0">Sample:</text>
  <text x="475" y="133" text-anchor="middle" font-size="14" fill="#2b6cb0">1,200 adults</text>
  <text x="475" y="158" text-anchor="middle" font-size="14" font-weight="bold" fill="#c53030">62% in favor</text>
  <text x="320" y="255" text-anchor="middle" font-size="14" font-style="italic">How close is the sample's 62% likely to be to the population percentage?</text>
</svg>
