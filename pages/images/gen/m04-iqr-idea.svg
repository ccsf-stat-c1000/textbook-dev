<svg viewBox="0 0 640 220" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" fill="#333333">
  <!-- main line -->
  <line x1="80" y1="120" x2="560" y2="120" stroke="#333333" stroke-width="3"/>
  <!-- quartile ticks -->
  <g stroke="#333333" stroke-width="2">
    <line x1="80" y1="105" x2="80" y2="135"/>
    <line x1="200" y1="105" x2="200" y2="135"/>
    <line x1="320" y1="105" x2="320" y2="135"/>
    <line x1="440" y1="105" x2="440" y2="135"/>
    <line x1="560" y1="105" x2="560" y2="135"/>
  </g>
  <!-- middle 50% highlight -->
  <rect x="200" y="110" width="240" height="20" fill="#7cb2e8" fill-opacity="0.55"/>
  <g font-size="14" font-weight="bold" text-anchor="middle">
    <text x="80" y="95">min</text>
    <text x="200" y="95">Q1</text>
    <text x="320" y="95">M</text>
    <text x="440" y="95">Q3</text>
    <text x="560" y="95">Max</text>
  </g>
  <g font-size="13" text-anchor="middle">
    <text x="140" y="160">bottom 25%</text>
    <text x="320" y="160" font-weight="bold" fill="#2b6cb0">middle 50% of the data</text>
    <text x="500" y="160">top 25%</text>
  </g>
  <!-- IQR bracket -->
  <path d="M 200 178 L 200 188 L 440 188 L 440 178" fill="none" stroke="#c53030" stroke-width="2"/>
  <text x="320" y="208" text-anchor="middle" font-size="15" font-weight="bold" fill="#c53030">IQR = Q3 &#8722; Q1</text>
</svg>
