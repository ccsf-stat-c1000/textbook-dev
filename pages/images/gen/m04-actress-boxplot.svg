<svg viewBox="0 0 640 280" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" fill="#333333">
  <text x="320" y="24" text-anchor="middle" font-size="16" font-weight="bold">Ages of Best Actress Oscar Winners (1970&#8211;2013)</text>
  <!-- whiskers -->
  <line x1="88" y1="120" x2="164" y2="120" stroke="#333333" stroke-width="2"/>
  <line x1="88" y1="100" x2="88" y2="140" stroke="#333333" stroke-width="2"/>
  <line x1="256" y1="120" x2="312" y2="120" stroke="#333333" stroke-width="2"/>
  <line x1="312" y1="100" x2="312" y2="140" stroke="#333333" stroke-width="2"/>
  <!-- box -->
  <rect x="164" y="90" width="92" height="60" fill="#7cb2e8" fill-opacity="0.55" stroke="#2b6cb0" stroke-width="2"/>
  <line x1="196" y1="90" x2="196" y2="150" stroke="#2b6cb0" stroke-width="3"/>
  <!-- outliers -->
  <g fill="#c53030">
    <circle cx="408" cy="116" r="5"/>
    <circle cx="408" cy="124" r="5"/>
    <circle cx="416" cy="120" r="5"/>
    <circle cx="512" cy="120" r="5"/>
    <circle cx="560" cy="120" r="5"/>
  </g>
  <text x="470" y="98" text-anchor="middle" font-size="13" font-weight="bold" fill="#c53030">outliers (61, 61, 62, 74, 80)</text>
  <!-- callouts -->
  <g font-size="13" text-anchor="middle">
    <text x="88" y="170">min = 21</text>
    <text x="164" y="60">Q1 = 30.5</text>
    <text x="222" y="42">M = 34.5</text>
    <text x="272" y="60">Q3 = 42</text>
    <text x="312" y="170">largest value</text>
    <text x="312" y="186">within 1.5(IQR) = 49</text>
  </g>
  <line x1="164" y1="66" x2="164" y2="86" stroke="#666666" stroke-width="1"/>
  <line x1="216" y1="48" x2="198" y2="86" stroke="#666666" stroke-width="1"/>
  <line x1="262" y1="66" x2="256" y2="86" stroke="#666666" stroke-width="1"/>
  <!-- axis -->
  <line x1="70" y1="220" x2="590" y2="220" stroke="#333333" stroke-width="1.5"/>
  <g stroke="#333333" stroke-width="1.5">
    <line x1="80" y1="220" x2="80" y2="226"/><line x1="160" y1="220" x2="160" y2="226"/>
    <line x1="240" y1="220" x2="240" y2="226"/><line x1="320" y1="220" x2="320" y2="226"/>
    <line x1="400" y1="220" x2="400" y2="226"/><line x1="480" y1="220" x2="480" y2="226"/>
    <line x1="560" y1="220" x2="560" y2="226"/>
  </g>
  <g font-size="13" text-anchor="middle">
    <text x="80" y="242">20</text><text x="160" y="242">30</text><text x="240" y="242">40</text>
    <text x="320" y="242">50</text><text x="400" y="242">60</text><text x="480" y="242">70</text><text x="560" y="242">80</text>
  </g>
  <text x="320" y="268" font-size="15" text-anchor="middle">Age</text>
</svg>
