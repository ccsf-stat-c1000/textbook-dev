<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" fill="#333333">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#333333"/>
    </marker>
  </defs>
  <text x="320" y="24" text-anchor="middle" font-size="15" font-weight="bold">Blocking by Vehicle Size</text>
  <circle cx="90" cy="165" r="48" fill="#eaf2fb" stroke="#2b6cb0" stroke-width="2"/>
  <text x="90" y="160" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6cb0">Sample</text>
  <text x="90" y="178" text-anchor="middle" font-size="12" fill="#2b6cb0">of cars</text>
  <line x1="130" y1="135" x2="185" y2="100" stroke="#333333" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="130" y1="195" x2="185" y2="230" stroke="#333333" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="195" y="70" width="130" height="50" rx="10" fill="#eaf2fb" stroke="#2b6cb0" stroke-width="2"/>
  <text x="260" y="100" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6cb0">Block: small cars</text>
  <rect x="195" y="205" width="130" height="50" rx="10" fill="#eaf2fb" stroke="#2b6cb0" stroke-width="2"/>
  <text x="260" y="235" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6cb0">Block: large cars</text>
  <line x1="330" y1="95" x2="385" y2="95" stroke="#2f855a" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="330" y1="230" x2="385" y2="230" stroke="#2f855a" stroke-width="2" marker-end="url(#arr)"/>
  <text x="357" y="83" text-anchor="middle" font-size="11" font-weight="bold" fill="#2f855a">random</text>
  <text x="357" y="218" text-anchor="middle" font-size="11" font-weight="bold" fill="#2f855a">random</text>
  <g stroke="#2f855a" stroke-width="1.5" fill="#e6f4ea">
    <rect x="395" y="55" width="180" height="34" rx="7"/>
    <rect x="395" y="97" width="180" height="34" rx="7"/>
    <rect x="395" y="190" width="180" height="34" rx="7"/>
    <rect x="395" y="232" width="180" height="34" rx="7"/>
  </g>
  <g font-size="12" text-anchor="middle" fill="#2f855a" font-weight="bold">
    <text x="485" y="76">Gasoline A</text>
    <text x="485" y="118">Gasoline B</text>
    <text x="485" y="211">Gasoline A</text>
    <text x="485" y="253">Gasoline B</text>
  </g>
  <text x="320" y="308" text-anchor="middle" font-size="13" font-style="italic">Mileage is compared within each block separately</text>
</svg>
