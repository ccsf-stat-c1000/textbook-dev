  <text x="180" y="77" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b6cb0">1. Sampling</text>
  <text x="180" y="97" text-anchor="middle" font-size="13">choose who is in the sample</text>
  <line x1="285" y1="80" x2="345" y2="80" stroke="#333333" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="355" y="50" width="200" height="60" rx="10" fill="#eaf2fb" stroke="#2b6cb0" stroke-width="2"/>
  <text x="455" y="77" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b6cb0">2. Study design</text>
