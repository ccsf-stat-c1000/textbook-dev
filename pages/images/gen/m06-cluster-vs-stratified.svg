    <rect x="436" y="60" width="75" height="100"/>
    <rect x="524" y="60" width="75" height="100"/>
    <rect x="348" y="180" width="75" height="100"/>
    <rect x="436" y="180" width="75" height="100"/>
    <rect x="524" y="180" width="75" height="100"/>
