    <circle cx="237" cy="85" r="4"/><circle cx="257" cy="105" r="4"/><circle cx="272" cy="80" r="4"/><circle cx="242" cy="130" r="4"/><circle cx="272" cy="135" r="4"/>
    <circle cx="148" cy="205" r="4"/><circle cx="168" cy="225" r="4"/><circle cx="183" cy="200" r="4"/><circle cx="153" cy="250" r="4"/><circle cx="183" cy="255" r="4"/>
    <circle cx="237" cy="205" r="4"/><circle cx="257" cy="225" r="4"/><circle cx="272" cy="200" r="4"/><circle cx="242" cy="250" r="4"/><circle cx="272" cy="255" r="4"/>
  </g>
  <g fill="#dd6b20">
    <circle cx="148" cy="85" r="4"/><circle cx="168" cy="105" r="4"/><circle cx="183" cy="80" r="4"/><circle cx="153" cy="130" r="4"/><circle cx="183" cy="135" r="4"/>
    <circle cx="60" cy="205" r="4"/><circle cx="80" cy="225" r="4"/><circle cx="95" cy="200" r="4"/><circle cx="65" cy="250" r="4"/><circle cx="95" cy="255" r="4"/>
