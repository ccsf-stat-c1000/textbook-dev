  <g fill="#2b6cb0">
    <circle cx="368" cy="85" r="4"/><circle cx="403" cy="80" r="4"/><circle cx="373" cy="130" r="4"/>
    <circle cx="456" cy="85" r="4"/><circle cx="491" cy="80" r="4"/><circle cx="461" cy="130" r="4"/>
    <circle cx="544" cy="85" r="4"/><circle cx="579" cy="80" r="4"/><circle cx="549" cy="130" r="4"/>
