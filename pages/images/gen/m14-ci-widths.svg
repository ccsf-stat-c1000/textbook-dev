<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" fill="#333333">
  <text x="320" y="24" text-anchor="middle" font-size="16" font-weight="bold">Higher Confidence &#8594; Wider Interval</text>
  <!-- 90% -->
  <line x1="190" y1="70" x2="450" y2="70" stroke="#2b6cb0" stroke-width="5"/>
  <line x1="190" y1="60" x2="190" y2="80" stroke="#2b6cb0" stroke-width="2.5"/>
  <line x1="450" y1="60" x2="450" y2="80" stroke="#2b6cb0" stroke-width="2.5"/>
  <text x="470" y="75" font-size="13" font-weight="bold" fill="#2b6cb0">90%: (112.5, 117.5)</text>
  <!-- 95% -->
  <line x1="164" y1="110" x2="476" y2="110" stroke="#2f855a" stroke-width="5"/>
  <line x1="164" y1="100" x2="164" y2="120" stroke="#2f855a" stroke-width="2.5"/>
  <line x1="476" y1="100" x2="476" y2="120" stroke="#2f855a" stroke-width="2.5"/>
  <text x="496" y="115" font-size="13" font-weight="bold" fill="#2f855a">95%: (112, 118)</text>
  <!-- 99% -->
  <line x1="112" y1="150" x2="528" y2="150" stroke="#dd6b20" stroke-width="5"/>
  <line x1="112" y1="140" x2="112" y2="160" stroke="#dd6b20" stroke-width="2.5"/>
  <line x1="528" y1="140" x2="528" y2="160" stroke="#dd6b20" stroke-width="2.5"/>
  <text x="548" y="155" font-size="13" font-weight="bold" fill="#dd6b20">99%</text>
  <!-- axis -->
  <line x1="60" y1="200" x2="580" y2="200" stroke="#333333" stroke-width="1.5"/>
  <line x1="320" y1="55" x2="320" y2="200" stroke="#c53030" stroke-width="1.5" stroke-dasharray="5 4"/>
  <g font-size="13" text-anchor="middle">
    <text x="112" y="220">111</text><text x="164" y="220">112</text><text x="320" y="220" font-weight="bold" fill="#c53030">x&#772; = 115</text>
    <text x="476" y="220">118</text><text x="528" y="220">119</text>
  </g>
</svg>
