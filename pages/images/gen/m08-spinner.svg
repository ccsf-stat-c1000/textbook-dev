<svg viewBox="0 0 320 270" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <!-- blue left half -->
  <path d="M 150 130 L 150 30 A 100 100 0 0 0 150 230 Z" fill="#2b6cb0"/>
  <!-- red top-right quarter -->
  <path d="M 150 130 L 150 30 A 100 100 0 0 1 250 130 Z" fill="#c53030"/>
  <!-- yellow bottom-right quarter -->
  <path d="M 150 130 L 250 130 A 100 100 0 0 1 150 230 Z" fill="#f6e05e"/>
  <circle cx="150" cy="130" r="100" fill="none" stroke="#333333" stroke-width="2"/>
  <!-- pointer -->
  <polygon points="150,110 141,140 159,140" fill="#333333" transform="rotate(40 150 130)"/>
  <circle cx="150" cy="130" r="8" fill="#333333"/>
  <text x="100" y="135" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">blue</text>
  <text x="200" y="85" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">red</text>
  <text x="203" y="190" text-anchor="middle" font-size="15" font-weight="bold" fill="#333333">yellow</text>
  <text x="160" y="258" text-anchor="middle" font-size="13" font-style="italic" fill="#333333">P(blue) = 1/2, P(red) = P(yellow) = 1/4</text>
</svg>
