    <circle cx="440" cy="94.9" r="5"/><circle cx="500" cy="89.7" r="5"/><circle cx="560" cy="84.6" r="5"/>
  </g>
  <line x1="80" y1="40" x2="80" y2="280" stroke="#333333" stroke-width="1.5"/>
  <line x1="80" y1="280" x2="580" y2="280" stroke="#333333" stroke-width="1.5"/>
