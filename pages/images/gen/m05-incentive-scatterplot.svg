<svg viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" fill="#333333">
  <text x="330" y="24" text-anchor="middle" font-size="16" font-weight="bold">Monetary Incentive vs. Percentage of Surveys Returned</text>
  <g fill="#2b6cb0">
    <circle cx="80" cy="225.1" r="5"/><circle cx="140" cy="166.9" r="5"/><circle cx="200" cy="132.6" r="5"/>
