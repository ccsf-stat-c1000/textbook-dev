<svg viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" fill="#333333">
  <text x="320" y="24" text-anchor="middle" font-size="16" font-weight="bold">Body Image by Gender (conditional percentages)</text>
  <g stroke="#dddddd" stroke-width="1">
    <line x1="80" y1="235" x2="600" y2="235"/>
    <line x1="80" y1="170" x2="600" y2="170"/>
    <line x1="80" y1="105" x2="600" y2="105"/>
    <line x1="80" y1="40" x2="600" y2="40"/>
  </g>
  <!-- About right -->
  <rect x="130" y="60.5" width="55" height="239.5" fill="#7cb2e8" stroke="#2b6cb0"/>
  <rect x="195" y="82.2" width="55" height="217.8" fill="#2f855a" fill-opacity="0.65" stroke="#2f855a"/>
  <text x="157" y="52" text-anchor="middle" font-size="13" font-weight="bold">73.7%</text>
  <text x="222" y="74" text-anchor="middle" font-size="13" font-weight="bold">67.0%</text>
  <!-- Overweight -->
  <rect x="295" y="230.1" width="55" height="69.9" fill="#7cb2e8" stroke="#2b6cb0"/>
  <rect x="360" y="246.7" width="55" height="53.3" fill="#2f855a" fill-opacity="0.65" stroke="#2f855a"/>
  <text x="322" y="222" text-anchor="middle" font-size="13" font-weight="bold">21.5%</text>
  <text x="387" y="238" text-anchor="middle" font-size="13" font-weight="bold">16.4%</text>
  <!-- Underweight -->
  <rect x="460" y="284.1" width="55" height="15.9" fill="#7cb2e8" stroke="#2b6cb0"/>
  <rect x="525" y="246" width="55" height="54" fill="#2f855a" fill-opacity="0.65" stroke="#2f855a"/>
  <text x="487" y="276" text-anchor="middle" font-size="13" font-weight="bold">4.9%</text>
  <text x="552" y="238" text-anchor="middle" font-size="13" font-weight="bold">16.6%</text>
  <!-- axes -->
  <line x1="80" y1="40" x2="80" y2="300" stroke="#333333" stroke-width="1.5"/>
  <line x1="80" y1="300" x2="600" y2="300" stroke="#333333" stroke-width="1.5"/>
  <g font-size="13" text-anchor="end">
    <text x="72" y="305">0</text><text x="72" y="240">20</text><text x="72" y="175">40</text>
    <text x="72" y="110">60</text><text x="72" y="45">80</text>
  </g>
  <g font-size="15" text-anchor="middle">
    <text x="190" y="322">About right</text>
    <text x="355" y="322">Overweight</text>
    <text x="520" y="322">Underweight</text>
  </g>
  <text x="24" y="170" font-size="15" text-anchor="middle" transform="rotate(-90 24 170)">Percent</text>
  <!-- legend -->
  <rect x="470" y="46" width="16" height="16" fill="#7cb2e8" stroke="#2b6cb0"/>
  <text x="493" y="59" font-size="14">Female</text>
  <rect x="470" y="70" width="16" height="16" fill="#2f855a" fill-opacity="0.65" stroke="#2f855a"/>
  <text x="493" y="83" font-size="14">Male</text>
</svg>
