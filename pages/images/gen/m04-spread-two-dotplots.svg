<svg viewBox="0 0 640 340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" fill="#333333">
  <text x="320" y="24" text-anchor="middle" font-size="16" font-weight="bold">Two Exam Score Distributions, Both Centered at 70</text>
  <!-- Class A: large spread -->
  <text x="70" y="52" font-size="14" font-weight="bold">Class A</text>
  <g fill="#2b6cb0">
    <circle cx="128" cy="118" r="4"/><circle cx="160" cy="118" r="4"/><circle cx="192" cy="118" r="4"/>
    <circle cx="224" cy="118" r="4"/><circle cx="224" cy="107" r="4"/><circle cx="256" cy="118" r="4"/>
    <circle cx="288" cy="118" r="4"/><circle cx="288" cy="107" r="4"/><circle cx="320" cy="118" r="4"/>
    <circle cx="320" cy="107" r="4"/><circle cx="320" cy="96" r="4"/><circle cx="352" cy="118" r="4"/>
    <circle cx="352" cy="107" r="4"/><circle cx="384" cy="118" r="4"/><circle cx="384" cy="107" r="4"/>
    <circle cx="416" cy="118" r="4"/><circle cx="448" cy="118" r="4"/><circle cx="480" cy="118" r="4"/>
    <circle cx="512" cy="118" r="4"/>
  </g>
  <line x1="80" y1="130" x2="580" y2="130" stroke="#333333" stroke-width="1.5"/>
  <g font-size="13" text-anchor="middle">
    <text x="128" y="148">45</text><text x="192" y="148">55</text><text x="256" y="148">65</text>
    <text x="320" y="148">70</text><text x="384" y="148">75</text><text x="448" y="148">85</text><text x="512" y="148">95</text>
  </g>
  <!-- Class B: small spread -->
  <text x="70" y="192" font-size="14" font-weight="bold">Class B</text>
  <g fill="#2f855a">
    <circle cx="256" cy="258" r="4"/><circle cx="288" cy="258" r="4"/><circle cx="288" cy="247" r="4"/>
    <circle cx="288" cy="236" r="4"/><circle cx="320" cy="258" r="4"/><circle cx="320" cy="247" r="4"/>
    <circle cx="320" cy="236" r="4"/><circle cx="320" cy="225" r="4"/><circle cx="320" cy="214" r="4"/>
    <circle cx="352" cy="258" r="4"/><circle cx="352" cy="247" r="4"/><circle cx="352" cy="236" r="4"/>
    <circle cx="384" cy="258" r="4"/>
  </g>
  <line x1="80" y1="270" x2="580" y2="270" stroke="#333333" stroke-width="1.5"/>
  <g font-size="13" text-anchor="middle">
    <text x="256" y="288">60</text><text x="288" y="288">65</text><text x="320" y="288">70</text>
    <text x="352" y="288">75</text><text x="384" y="288">80</text>
  </g>
  <text x="320" y="322" text-anchor="middle" font-size="14" font-style="italic">Same center, very different spread</text>
</svg>
