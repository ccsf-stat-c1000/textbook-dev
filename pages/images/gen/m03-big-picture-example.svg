<svg viewBox="0 0 640 350" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" fill="#333333">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#333333"/>
    </marker>
  </defs>
  <!-- Population -->
  <ellipse cx="150" cy="175" rx="115" ry="100" fill="#eaf2fb" stroke="#2b6cb0" stroke-width="2"/>
  <text x="150" y="105" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b6cb0">Population:</text>
  <text x="150" y="125" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b6cb0">all U.S. adults</text>
  <g fill="#2b6cb0">
    <circle cx="95" cy="160" r="4"/><circle cx="130" cy="150" r="4"/><circle cx="170" cy="155" r="4"/>
    <circle cx="205" cy="160" r="4"/><circle cx="80" cy="200" r="4"/><circle cx="118" cy="190" r="4"/>
    <circle cx="155" cy="182" r="4"/><circle cx="193" cy="195" r="4"/><circle cx="222" cy="190" r="4"/>
    <circle cx="100" cy="238" r="4"/><circle cx="142" cy="225" r="4"/><circle cx="182" cy="235" r="4"/>
    <circle cx="212" cy="222" r="4"/><circle cx="160" cy="255" r="4"/>
  </g>
  <!-- Step 1 -->
  <path d="M 252 128 Q 345 65 434 110" fill="none" stroke="#333333" stroke-width="2" marker-end="url(#arr)"/>
  <text x="335" y="30" text-anchor="middle" font-size="14" font-weight="bold">Step 1: A sample of 1,082 U.S. adults is</text>
  <text x="335" y="48" text-anchor="middle" font-size="14" font-weight="bold">chosen and asked about the death penalty</text>
  <!-- Sample -->
  <circle cx="490" cy="130" r="58" fill="#eaf2fb" stroke="#2b6cb0" stroke-width="2"/>
  <text x="490" y="100" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b6cb0">Sample:</text>
  <text x="490" y="118" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6cb0">1,082 adults</text>
  <g fill="#2b6cb0">
    <circle cx="470" cy="135" r="4"/><circle cx="505" cy="130" r="4"/><circle cx="522" cy="150" r="4"/>
    <circle cx="485" cy="155" r="4"/><circle cx="462" cy="155" r="4"/><circle cx="500" cy="168" r="4"/>
  </g>
  <!-- Step 2 -->
  <line x1="490" y1="190" x2="490" y2="220" stroke="#333333" stroke-width="2" marker-end="url(#arr)"/>
  <text x="502" y="210" font-size="13" font-weight="bold">Step 2: EDA</text>
  <rect x="405" y="226" width="180" height="52" rx="10" fill="#eaf2fb" stroke="#2b6cb0" stroke-width="2"/>
  <text x="495" y="248" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6cb0">65% of the sample</text>
  <text x="495" y="266" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6cb0">favor the death penalty</text>
  <!-- Steps 3 & 4 -->
  <path d="M 403 262 Q 300 330 197 272" fill="none" stroke="#333333" stroke-width="2" marker-end="url(#arr)"/>
  <text x="310" y="322" text-anchor="middle" font-size="13" font-weight="bold">Steps 3 &amp; 4: We can be 95% confident that between 62%</text>
  <text x="310" y="340" text-anchor="middle" font-size="13" font-weight="bold">and 68% of all U.S. adults favor the death penalty</text>
</svg>
