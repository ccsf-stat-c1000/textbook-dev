<svg viewBox="0 0 640 375" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" fill="#333333">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#333333"/>
    </marker>
    <marker id="arrh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#dd6b20"/>
    </marker>
  </defs>
  <text x="335" y="22" text-anchor="middle" font-size="14" font-weight="bold">Step 1: A sample of 1,082 U.S. adults is</text>
  <text x="335" y="40" text-anchor="middle" font-size="14" font-weight="bold">chosen and asked about the death penalty</text>
  <path d="M 216 137 Q 330 60 437 112" fill="none" stroke="#333333" stroke-width="2" marker-end="url(#arr)"/>
  <!-- Step 4: Inference box enclosing the Population -->
  <rect x="20" y="50" width="260" height="280" rx="14" fill="none" stroke="#2b6cb0" stroke-width="2"/>
  <ellipse cx="150" cy="168" rx="112" ry="95" fill="#eaf2fb" stroke="#2b6cb0" stroke-width="2"/>
  <text x="150" y="105" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b6cb0">Population:</text>
  <text x="150" y="123" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b6cb0">all U.S. adults</text>
  <circle cx="190" cy="155" r="28" fill="#eaf2fb" stroke="#2b6cb0" stroke-width="2"/>
  <g fill="#2b6cb0">
    <circle cx="179.6" cy="160.2" r="2.5"/><circle cx="197.8" cy="157.6" r="2.5"/><circle cx="206.6" cy="168.0" r="2.5"/><circle cx="187.4" cy="170.6" r="2.5"/><circle cx="175.5" cy="170.6" r="2.5"/><circle cx="195.2" cy="175.7" r="2.5"/>
  </g>
  <g fill="#2b6cb0">
    <circle cx="95" cy="160" r="2.5"/><circle cx="130" cy="150" r="2.5"/>
    <circle cx="80" cy="200" r="2.5"/><circle cx="118" cy="190" r="2.5"/>
    <circle cx="155" cy="182" r="2.5"/><circle cx="193" cy="195" r="2.5"/><circle cx="222" cy="190" r="2.5"/>
    <circle cx="100" cy="230" r="2.5"/><circle cx="142" cy="225" r="2.5"/><circle cx="182" cy="235" r="2.5"/>
    <circle cx="212" cy="222" r="2.5"/><circle cx="160" cy="248" r="2.5"/>
  </g>
  <text x="150" y="283" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6cb0">Step 4: We can be 95% confident</text>
  <text x="150" y="300" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6cb0">that between 62% and 68% of all</text>
  <text x="150" y="317" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6cb0">U.S. adults favor the death penalty</text>
  <!-- Step 2: EDA box enclosing the Sample -->
  <rect x="405" y="50" width="175" height="216" rx="14" fill="none" stroke="#2b6cb0" stroke-width="2"/>
  <circle cx="492" cy="128" r="54" fill="#eaf2fb" stroke="#2b6cb0" stroke-width="2"/>
  <text x="492" y="103" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b6cb0">Sample:</text>
  <text x="492" y="121" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6cb0">1,082 adults</text>
  <g fill="#2b6cb0">
    <circle cx="472" cy="138" r="4"/><circle cx="507" cy="133" r="4"/><circle cx="524" cy="153" r="4"/>
    <circle cx="487" cy="158" r="4"/><circle cx="464" cy="158" r="4"/><circle cx="502" cy="168" r="4"/>
  </g>
  <text x="492" y="211" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b6cb0">Step 2:</text>
  <text x="492" y="229" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6cb0">65% of the sample</text>
  <text x="492" y="247" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6cb0">favor the death penalty</text>
  <!-- Step 3: Probability (cloud = theory) -->
  <path d="M 460 268 Q 375 365 287 290" fill="none" stroke="#333333" stroke-width="2" marker-end="url(#arr)"/>
  <g transform="translate(368,330) scale(0.9)">
    <path d="M -62 30 a 22 22 0 0 1 -14 -39 a 27 27 0 0 1 36 -25 a 32 32 0 0 1 52 -4 a 27 27 0 0 1 42 18 a 22 22 0 0 1 -4 50 z" fill="#eaf2fb" stroke="#2b6cb0" stroke-width="2.2" stroke-linejoin="round"/>
  </g>
  <text x="368" y="318" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6cb0">Step 3:</text>
  <text x="368" y="340" text-anchor="middle" font-size="16" font-weight="bold" fill="#2b6cb0">Probability</text>
</svg>
