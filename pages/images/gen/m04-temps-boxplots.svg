<svg viewBox="0 0 640 380" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" fill="#333333">
  <text x="340" y="26" text-anchor="middle" font-size="16" font-weight="bold">Average Monthly High Temperature: San Francisco vs. Pittsburgh</text>
  <!-- y axis -->
  <line x1="100" y1="60" x2="100" y2="310" stroke="#333333" stroke-width="1.5"/>
  <g stroke="#333333" stroke-width="1.5">
    <line x1="94" y1="300" x2="100" y2="300"/><line x1="94" y1="256.4" x2="100" y2="256.4"/>
    <line x1="94" y1="212.7" x2="100" y2="212.7"/><line x1="94" y1="169.1" x2="100" y2="169.1"/>
    <line x1="94" y1="125.5" x2="100" y2="125.5"/><line x1="94" y1="81.8" x2="100" y2="81.8"/>
  </g>
  <g font-size="13" text-anchor="end">
    <text x="88" y="305">30</text><text x="88" y="261">40</text><text x="88" y="218">50</text>
    <text x="88" y="174">60</text><text x="88" y="130">70</text><text x="88" y="87">80</text>
  </g>
  <text x="40" y="185" font-size="15" text-anchor="middle" transform="rotate(-90 40 185)">Temperature (&#176;F)</text>
  <!-- San Francisco -->
  <line x1="230" y1="185.2" x2="230" y2="168.2" stroke="#333333" stroke-width="2"/>
  <line x1="205" y1="185.2" x2="255" y2="185.2" stroke="#333333" stroke-width="2"/>
  <rect x="180" y="145.8" width="100" height="22.4" fill="#7cb2e8" fill-opacity="0.55" stroke="#2b6cb0" stroke-width="2"/>
  <line x1="180" y1="157.3" x2="280" y2="157.3" stroke="#2b6cb0" stroke-width="3"/>
  <line x1="230" y1="145.8" x2="230" y2="131.1" stroke="#333333" stroke-width="2"/>
  <line x1="205" y1="131.1" x2="255" y2="131.1" stroke="#333333" stroke-width="2"/>
  <text x="230" y="340" text-anchor="middle" font-size="15" font-weight="bold">San Francisco</text>
  <!-- Pittsburgh -->
  <line x1="470" y1="283.9" x2="470" y2="251.1" stroke="#333333" stroke-width="2"/>
  <line x1="445" y1="283.9" x2="495" y2="283.9" stroke="#333333" stroke-width="2"/>
  <rect x="420" y="91.6" width="100" height="159.5" fill="#2f855a" fill-opacity="0.35" stroke="#2f855a" stroke-width="2"/>
  <line x1="420" y1="163" x2="520" y2="163" stroke="#2f855a" stroke-width="3"/>
  <line x1="470" y1="91.6" x2="470" y2="70.4" stroke="#333333" stroke-width="2"/>
  <line x1="445" y1="70.4" x2="495" y2="70.4" stroke="#333333" stroke-width="2"/>
  <text x="470" y="340" text-anchor="middle" font-size="15" font-weight="bold">Pittsburgh</text>
</svg>
