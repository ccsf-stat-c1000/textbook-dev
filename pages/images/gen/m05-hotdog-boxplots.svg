<svg viewBox="0 0 640 380" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" fill="#333333">
  <text x="340" y="26" text-anchor="middle" font-size="16" font-weight="bold">Calories by Type of Hot Dog (54 brands)</text>
  <!-- y axis -->
  <line x1="110" y1="60" x2="110" y2="310" stroke="#333333" stroke-width="1.5"/>
  <g stroke="#333333" stroke-width="1.5">
    <line x1="104" y1="300" x2="110" y2="300"/><line x1="104" y1="260" x2="110" y2="260"/>
    <line x1="104" y1="220" x2="110" y2="220"/><line x1="104" y1="180" x2="110" y2="180"/>
    <line x1="104" y1="140" x2="110" y2="140"/><line x1="104" y1="100" x2="110" y2="100"/>
    <line x1="104" y1="60" x2="110" y2="60"/>
  </g>
  <g font-size="13" text-anchor="end">
    <text x="98" y="305">80</text><text x="98" y="265">100</text><text x="98" y="225">120</text>
    <text x="98" y="185">140</text><text x="98" y="145">160</text><text x="98" y="105">180</text>
    <text x="98" y="65">200</text>
  </g>
  <text x="46" y="185" font-size="15" text-anchor="middle" transform="rotate(-90 46 185)">Calories</text>
  <!-- Beef -->
  <line x1="200" y1="238" x2="200" y2="181" stroke="#333333" stroke-width="2"/>
  <line x1="180" y1="238" x2="220" y2="238" stroke="#333333" stroke-width="2"/>
  <rect x="160" y="100.5" width="80" height="80.5" fill="#7cb2e8" fill-opacity="0.55" stroke="#2b6cb0" stroke-width="2"/>
  <line x1="160" y1="155" x2="240" y2="155" stroke="#2b6cb0" stroke-width="3"/>
  <line x1="200" y1="100.5" x2="200" y2="80" stroke="#333333" stroke-width="2"/>
  <line x1="180" y1="80" x2="220" y2="80" stroke="#333333" stroke-width="2"/>
  <text x="200" y="340" text-anchor="middle" font-size="15" font-weight="bold">Beef</text>
  <!-- Meat -->
  <line x1="360" y1="246" x2="360" y2="183" stroke="#333333" stroke-width="2"/>
  <line x1="340" y1="246" x2="380" y2="246" stroke="#333333" stroke-width="2"/>
  <rect x="320" y="99" width="80" height="84" fill="#2f855a" fill-opacity="0.35" stroke="#2f855a" stroke-width="2"/>
  <line x1="320" y1="154" x2="400" y2="154" stroke="#2f855a" stroke-width="3"/>
  <line x1="360" y1="99" x2="360" y2="70" stroke="#333333" stroke-width="2"/>
  <line x1="340" y1="70" x2="380" y2="70" stroke="#333333" stroke-width="2"/>
  <text x="360" y="340" text-anchor="middle" font-size="15" font-weight="bold">Meat</text>
  <!-- Poultry -->
  <line x1="520" y1="288" x2="520" y2="259" stroke="#333333" stroke-width="2"/>
  <line x1="500" y1="288" x2="540" y2="288" stroke="#333333" stroke-width="2"/>
  <rect x="480" y="175" width="80" height="84" fill="#dd6b20" fill-opacity="0.35" stroke="#dd6b20" stroke-width="2"/>
  <line x1="480" y1="234" x2="560" y2="234" stroke="#dd6b20" stroke-width="3"/>
  <line x1="520" y1="175" x2="520" y2="156" stroke="#333333" stroke-width="2"/>
  <line x1="500" y1="156" x2="540" y2="156" stroke="#333333" stroke-width="2"/>
  <text x="520" y="340" text-anchor="middle" font-size="15" font-weight="bold">Poultry</text>
</svg>
