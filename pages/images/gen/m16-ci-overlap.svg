<svg viewBox="0 0 640 150" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <line x1="60" y1="110" x2="580" y2="110" stroke="#333333" stroke-width="1.5"/>
