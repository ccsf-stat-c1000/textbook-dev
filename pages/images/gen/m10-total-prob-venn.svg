<svg viewBox="0 0 640 280" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" fill="#333333">
  <rect x="80" y="30" width="240" height="210" fill="#eaf2fb" stroke="#333333" stroke-width="2"/>
  <rect x="320" y="30" width="240" height="210" fill="#fdebd9" stroke="#333333" stroke-width="2"/>
  <text x="110" y="58" font-size="15" font-weight="bold" fill="#2b6cb0">C</text>
  <text x="500" y="58" font-size="15" font-weight="bold" fill="#dd6b20">not C</text>
  <ellipse cx="320" cy="150" rx="120" ry="65" fill="#ffffff" fill-opacity="0.4" stroke="#c53030" stroke-width="2.5"/>
  <text x="320" y="105" text-anchor="middle" font-size="15" font-weight="bold" fill="#c53030">V</text>
  <text x="262" y="155" text-anchor="middle" font-size="13" font-weight="bold">C and V</text>
  <text x="382" y="155" text-anchor="middle" font-size="13" font-weight="bold">not C and V</text>
  <text x="320" y="268" text-anchor="middle" font-size="13" font-style="italic">V is split into two disjoint pieces: (C and V) and (not C and V)</text>
</svg>
