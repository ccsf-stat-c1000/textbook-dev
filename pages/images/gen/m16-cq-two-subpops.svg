<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <!-- Population -->
  <circle cx="150" cy="130" r="95" fill="#7cb2e8" fill-opacity="0.35" stroke="#2b6cb0" stroke-width="2"/>
  <text x="150" y="115" text-anchor="middle" font-size="14" font-weight="bold" fill="#333333">Population</text>
  <text x="150" y="145" text-anchor="middle" font-size="12" font-style="italic" fill="#c53030">Are Y and X related?</text>
  <text x="150" y="165" text-anchor="middle" font-size="12" fill="#333333">(X has k = 2 categories)</text>
  <!-- Arrows -->
  <line x1="238" y1="95" x2="390" y2="70" stroke="#2b6cb0" stroke-width="1.5"/>
  <line x1="238" y1="165" x2="390" y2="190" stroke="#2b6cb0" stroke-width="1.5"/>
  <!-- Subpops -->
  <ellipse cx="480" cy="65" rx="90" ry="38" fill="#7cb2e8" stroke="#2b6cb0" stroke-width="1.5"/>
  <text x="480" y="61" text-anchor="middle" font-size="13" fill="#333333">Sub-population 1</text>
  <text x="480" y="79" text-anchor="middle" font-size="13" font-weight="bold" fill="#333333">mean of Y: &#956;&#8321;</text>
  <ellipse cx="480" cy="195" rx="90" ry="38" fill="#7cb2e8" stroke="#2b6cb0" stroke-width="1.5"/>
  <text x="480" y="191" text-anchor="middle" font-size="13" fill="#333333">Sub-population 2</text>
  <text x="480" y="209" text-anchor="middle" font-size="13" font-weight="bold" fill="#333333">mean of Y: &#956;&#8322;</text>
  <!-- Compare bracket -->
  <text x="600" y="135" text-anchor="middle" font-size="12" fill="#2f855a" transform="rotate(90 600 135)">compare</text>
</svg>
