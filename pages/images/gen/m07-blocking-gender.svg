<svg viewBox="0 0 640 340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" fill="#333333">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#333333"/>
    </marker>
  </defs>
  <text x="320" y="24" text-anchor="middle" font-size="15" font-weight="bold">Blocking by Gender, then Randomizing Within Blocks</text>
  <circle cx="90" cy="175" r="48" fill="#eaf2fb" stroke="#2b6cb0" stroke-width="2"/>
  <text x="90" y="180" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6cb0">Sample</text>
  <line x1="130" y1="145" x2="185" y2="105" stroke="#333333" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="130" y1="205" x2="185" y2="245" stroke="#333333" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="195" y="75" width="120" height="50" rx="10" fill="#eaf2fb" stroke="#2b6cb0" stroke-width="2"/>
  <text x="255" y="105" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6cb0">Block: males</text>
  <rect x="195" y="220" width="120" height="50" rx="10" fill="#eaf2fb" stroke="#2b6cb0" stroke-width="2"/>
  <text x="255" y="250" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6cb0">Block: females</text>
  <line x1="320" y1="100" x2="375" y2="100" stroke="#2f855a" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="320" y1="245" x2="375" y2="245" stroke="#2f855a" stroke-width="2" marker-end="url(#arr)"/>
  <text x="347" y="88" text-anchor="middle" font-size="11" font-weight="bold" fill="#2f855a">random</text>
  <text x="347" y="233" text-anchor="middle" font-size="11" font-weight="bold" fill="#2f855a">random</text>
  <g stroke="#2f855a" stroke-width="1.5" fill="#e6f4ea">
    <rect x="385" y="45" width="200" height="32" rx="7"/>
    <rect x="385" y="84" width="200" height="32" rx="7"/>
    <rect x="385" y="123" width="200" height="32" rx="7"/>
    <rect x="385" y="190" width="200" height="32" rx="7"/>
    <rect x="385" y="229" width="200" height="32" rx="7"/>
    <rect x="385" y="268" width="200" height="32" rx="7"/>
  </g>
  <g font-size="12" text-anchor="middle" fill="#2f855a" font-weight="bold">
    <text x="485" y="65">existing software</text>
    <text x="485" y="104">new software 1</text>
    <text x="485" y="143">new software 2</text>
    <text x="485" y="210">existing software</text>
    <text x="485" y="249">new software 1</text>
    <text x="485" y="288">new software 2</text>
  </g>
  <text x="320" y="330" text-anchor="middle" font-size="13" font-style="italic">Results are compared within each block separately</text>
</svg>
