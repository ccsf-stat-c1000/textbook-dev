<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" fill="#333333">
  <text x="320" y="24" text-anchor="middle" font-size="15" font-weight="bold">Narrower and Narrower Intervals Approach a Smooth Curve</text>
  <!-- coarse bars -->
  <g fill="#7cb2e8" stroke="#2b6cb0" stroke-width="0.5">
    <rect x="45" y="180" width="20" height="20"/><rect x="65" y="150" width="20" height="50"/>
    <rect x="85" y="110" width="20" height="90"/><rect x="105" y="80" width="20" height="120"/>
    <rect x="125" y="110" width="20" height="90"/><rect x="145" y="150" width="20" height="50"/>
    <rect x="165" y="180" width="20" height="20"/>
  </g>
  <line x1="40" y1="200" x2="195" y2="200" stroke="#333333" stroke-width="1.5"/>
  <text x="117" y="222" text-anchor="middle" font-size="13">interval width 0.25</text>
  <!-- fine bars -->
  <g fill="#7cb2e8" stroke="#2b6cb0" stroke-width="0.3">
    <rect x="250" y="190" width="8" height="10"/><rect x="258" y="180" width="8" height="20"/>
    <rect x="266" y="166" width="8" height="34"/><rect x="274" y="150" width="8" height="50"/>
    <rect x="282" y="132" width="8" height="68"/><rect x="290" y="112" width="8" height="88"/>
    <rect x="298" y="94" width="8" height="106"/><rect x="306" y="82" width="8" height="118"/>
    <rect x="314" y="80" width="8" height="120"/><rect x="322" y="88" width="8" height="112"/>
    <rect x="330" y="102" width="8" height="98"/><rect x="338" y="122" width="8" height="78"/>
    <rect x="346" y="142" width="8" height="58"/><rect x="354" y="160" width="8" height="40"/>
    <rect x="362" y="176" width="8" height="24"/><rect x="370" y="188" width="8" height="12"/>
  </g>
  <line x1="245" y1="200" x2="385" y2="200" stroke="#333333" stroke-width="1.5"/>
  <text x="315" y="222" text-anchor="middle" font-size="13">interval width 0.10</text>
  <!-- smooth curve -->
  <path d="M 440 198 C 470 195 480 80 515 80 C 550 80 560 195 590 198" fill="#7cb2e8" fill-opacity="0.4" stroke="#2b6cb0" stroke-width="2.5"/>
  <line x1="435" y1="200" x2="600" y2="200" stroke="#333333" stroke-width="1.5"/>
  <text x="517" y="222" text-anchor="middle" font-size="13">smooth density curve</text>
</svg>
