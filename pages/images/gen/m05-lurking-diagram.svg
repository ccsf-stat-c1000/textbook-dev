<svg viewBox="0 0 640 280" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" fill="#333333">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#333333"/>
    </marker>
  </defs>
  <rect x="215" y="20" width="210" height="52" rx="10" fill="#fdebd9" stroke="#dd6b20" stroke-width="2.5"/>
  <text x="320" y="42" text-anchor="middle" font-size="14" font-weight="bold" fill="#dd6b20">Lurking variable:</text>
  <text x="320" y="61" text-anchor="middle" font-size="14" font-weight="bold" fill="#dd6b20">seriousness of the fire</text>
  <line x1="245" y1="72" x2="145" y2="145" stroke="#333333" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="395" y1="72" x2="495" y2="145" stroke="#333333" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="35" y="150" width="210" height="52" rx="10" fill="#eaf2fb" stroke="#2b6cb0" stroke-width="2"/>
  <text x="140" y="172" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6cb0">X: number of</text>
  <text x="140" y="191" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6cb0">firefighters sent</text>
  <rect x="395" y="150" width="210" height="52" rx="10" fill="#eaf2fb" stroke="#2b6cb0" stroke-width="2"/>
  <text x="500" y="172" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6cb0">Y: amount</text>
  <text x="500" y="191" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6cb0">of damage</text>
  <line x1="250" y1="176" x2="390" y2="176" stroke="#c53030" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="320" y="235" text-anchor="middle" font-size="13" font-style="italic" fill="#c53030">observed association between X and Y &#8212; but no causal link</text>
