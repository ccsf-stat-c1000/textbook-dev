<svg viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" fill="#333333">
  <text x="330" y="24" text-anchor="middle" font-size="16" font-weight="bold">Speed vs. Fuel Used</text>
  <g fill="#2b6cb0">
    <circle cx="110" cy="70" r="5"/><circle cx="140" cy="150" r="5"/><circle cx="170" cy="180" r="5"/>
    <circle cx="200" cy="200" r="5"/><circle cx="230" cy="210" r="5"/><circle cx="260" cy="221" r="5"/>
    <circle cx="290" cy="217" r="5"/><circle cx="320" cy="210" r="5"/><circle cx="350" cy="204" r="5"/>
    <circle cx="380" cy="195" r="5"/><circle cx="410" cy="186" r="5"/><circle cx="440" cy="175" r="5"/>
    <circle cx="470" cy="165" r="5"/><circle cx="500" cy="152" r="5"/><circle cx="530" cy="145" r="5"/>
  </g>
  <line x1="80" y1="40" x2="80" y2="280" stroke="#333333" stroke-width="1.5"/>
  <line x1="80" y1="280" x2="580" y2="280" stroke="#333333" stroke-width="1.5"/>
  <g font-size="13" text-anchor="middle">
    <text x="80" y="298">0</text><text x="230" y="298">50</text><text x="380" y="298">100</text><text x="530" y="298">150</text>
  </g>
  <g font-size="13" text-anchor="end">
    <text x="72" y="285">0</text><text x="72" y="235">5</text><text x="72" y="185">10</text>
    <text x="72" y="135">15</text><text x="72" y="85">20</text>
  </g>
  <text x="330" y="330" font-size="15" text-anchor="middle">Speed (km/h)</text>
  <text x="24" y="160" font-size="15" text-anchor="middle" transform="rotate(-90 24 160)">Fuel used (liters/100 km)</text>
</svg>
