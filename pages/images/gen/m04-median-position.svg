<svg viewBox="0 0 640 230" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" fill="#333333">
  <text x="70" y="70" font-size="15" font-weight="bold" text-anchor="start">n = 7:</text>
  <g fill="#2b6cb0">
    <circle cx="180" cy="65" r="10"/><circle cx="230" cy="65" r="10"/><circle cx="280" cy="65" r="10"/>
    <circle cx="380" cy="65" r="10"/><circle cx="430" cy="65" r="10"/><circle cx="480" cy="65" r="10"/>
  </g>
  <circle cx="330" cy="65" r="10" fill="#c53030"/>
  <text x="330" y="35" text-anchor="middle" font-size="15" font-weight="bold" fill="#c53030">M</text>
  <line x1="330" y1="42" x2="330" y2="50" stroke="#c53030" stroke-width="2"/>
  <text x="330" y="98" text-anchor="middle" font-size="13">the (7+1)/2 = 4th observation</text>
  <text x="70" y="170" font-size="15" font-weight="bold" text-anchor="start">n = 8:</text>
  <g fill="#2b6cb0">
    <circle cx="155" cy="165" r="10"/><circle cx="205" cy="165" r="10"/><circle cx="255" cy="165" r="10"/>
    <circle cx="405" cy="165" r="10"/><circle cx="455" cy="165" r="10"/><circle cx="505" cy="165" r="10"/>
  </g>
  <circle cx="305" cy="165" r="10" fill="#c53030"/>
  <circle cx="355" cy="165" r="10" fill="#c53030"/>
  <text x="330" y="135" text-anchor="middle" font-size="15" font-weight="bold" fill="#c53030">M = mean of these two</text>
  <line x1="330" y1="142" x2="330" y2="152" stroke="#c53030" stroke-width="2"/>
  <text x="330" y="198" text-anchor="middle" font-size="13">the 8/2 = 4th and 8/2 + 1 = 5th observations</text>
</svg>
