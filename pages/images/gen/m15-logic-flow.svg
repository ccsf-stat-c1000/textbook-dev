<svg viewBox="0 0 640 380" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <!-- Step 1 -->
  <rect x="120" y="20" width="400" height="60" rx="8" fill="#7cb2e8" stroke="#2b6cb0" stroke-width="2"/>
  <text x="320" y="45" text-anchor="middle" font-size="15" font-weight="bold" fill="#333333">1. State the claims</text>
  <text x="320" y="66" text-anchor="middle" font-size="13" fill="#333333">Claim 1: &#8220;nothing special is going on&#8221; &#8212; challenged by Claim 2</text>
  <line x1="320" y1="80" x2="320" y2="106" stroke="#2b6cb0" stroke-width="2"/>
  <polygon points="314,104 326,104 320,114" fill="#2b6cb0"/>
  <!-- Step 2 -->
  <rect x="120" y="114" width="400" height="60" rx="8" fill="#7cb2e8" stroke="#2b6cb0" stroke-width="2"/>
  <text x="320" y="139" text-anchor="middle" font-size="15" font-weight="bold" fill="#333333">2. Collect and summarize the data</text>
  <text x="320" y="160" text-anchor="middle" font-size="13" fill="#333333">Choose a random sample and compute sample statistics</text>
  <line x1="320" y1="174" x2="320" y2="200" stroke="#2b6cb0" stroke-width="2"/>
  <polygon points="314,198 326,198 320,208" fill="#2b6cb0"/>
  <!-- Step 3 -->
  <rect x="120" y="208" width="400" height="60" rx="8" fill="#7cb2e8" stroke="#2b6cb0" stroke-width="2"/>
  <text x="320" y="233" text-anchor="middle" font-size="15" font-weight="bold" fill="#333333">3. Assess the evidence</text>
  <text x="320" y="254" text-anchor="middle" font-size="13" fill="#333333">How surprising is data like ours if Claim 1 is true?</text>
  <line x1="320" y1="268" x2="320" y2="294" stroke="#2b6cb0" stroke-width="2"/>
  <polygon points="314,292 326,292 320,302" fill="#2b6cb0"/>
  <!-- Step 4 -->
  <rect x="120" y="302" width="400" height="60" rx="8" fill="#7cb2e8" stroke="#2b6cb0" stroke-width="2"/>
  <text x="320" y="327" text-anchor="middle" font-size="15" font-weight="bold" fill="#333333">4. Draw conclusions in context</text>
  <text x="320" y="348" text-anchor="middle" font-size="13" fill="#333333">Reject Claim 1, or conclude the evidence is not strong enough</text>
</svg>
