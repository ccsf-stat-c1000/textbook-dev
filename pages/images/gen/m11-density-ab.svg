<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" fill="#333333">
  <text x="320" y="24" text-anchor="middle" font-size="16" font-weight="bold">P(a &#8804; X &#8804; b) = area between a and b under the density curve</text>
  <polygon points="250,240 250,115 300,150 350,172 400,188 400,240" fill="#2b6cb0" fill-opacity="0.55"/>
  <polyline points="80,220 120,190 150,110 180,75 210,80 250,115 300,150 350,172 400,188 450,200 500,210 560,218" fill="none" stroke="#2b6cb0" stroke-width="2.5"/>
  <line x1="70" y1="240" x2="590" y2="240" stroke="#333333" stroke-width="1.5"/>
  <g stroke="#c53030" stroke-width="2">
    <line x1="250" y1="240" x2="250" y2="248"/>
    <line x1="400" y1="240" x2="400" y2="248"/>
  </g>
  <g font-size="15" text-anchor="middle" font-weight="bold" fill="#c53030">
