<svg viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" fill="#333333">
  <text x="320" y="26" text-anchor="middle" font-size="18" font-weight="bold">Exam Grades of 15 Students</text>
  <!-- gridlines -->
  <g stroke="#dddddd" stroke-width="1">
    <line x1="80" y1="252" x2="560" y2="252"/>
    <line x1="80" y1="204" x2="560" y2="204"/>
    <line x1="80" y1="156" x2="560" y2="156"/>
    <line x1="80" y1="108" x2="560" y2="108"/>
    <line x1="80" y1="60" x2="560" y2="60"/>
  </g>
  <!-- bars -->
  <g fill="#7cb2e8" stroke="#2b6cb0" stroke-width="1">
    <rect x="80" y="252" width="80" height="48"/>
    <rect x="160" y="204" width="80" height="96"/>
    <rect x="240" y="108" width="80" height="192"/>
    <rect x="320" y="60" width="80" height="240"/>
    <rect x="400" y="204" width="80" height="96"/>
    <rect x="480" y="252" width="80" height="48"/>
  </g>
  <!-- axes -->
  <line x1="80" y1="40" x2="80" y2="300" stroke="#333333" stroke-width="1.5"/>
  <line x1="80" y1="300" x2="580" y2="300" stroke="#333333" stroke-width="1.5"/>
  <g font-size="13" text-anchor="middle">
    <text x="80" y="318">40</text><text x="160" y="318">50</text><text x="240" y="318">60</text>
    <text x="320" y="318">70</text><text x="400" y="318">80</text><text x="480" y="318">90</text>
    <text x="560" y="318">100</text>
  </g>
  <g font-size="13" text-anchor="end">
    <text x="72" y="305">0</text><text x="72" y="257">1</text><text x="72" y="209">2</text>
    <text x="72" y="161">3</text><text x="72" y="113">4</text><text x="72" y="65">5</text>
  </g>
  <text x="330" y="345" font-size="16" text-anchor="middle">Score</text>
  <text x="24" y="170" font-size="16" text-anchor="middle" transform="rotate(-90 24 170)">Count</text>
</svg>
