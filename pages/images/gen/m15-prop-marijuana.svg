<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <!-- Population -->
  <circle cx="185" cy="160" r="120" fill="#7cb2e8" fill-opacity="0.35" stroke="#2b6cb0" stroke-width="2"/>
  <text x="185" y="90" text-anchor="middle" font-size="14" font-weight="bold" fill="#333333">Population</text>
  <text x="185" y="110" text-anchor="middle" font-size="13" fill="#333333">All students at the college</text>
  <text x="185" y="150" text-anchor="middle" font-size="13" fill="#c53030">p = proportion who use marijuana</text>
  <text x="185" y="185" text-anchor="middle" font-size="13" font-style="italic" fill="#333333">Is p equal to 0.157 (the national</text>
  <text x="185" y="202" text-anchor="middle" font-size="13" font-style="italic" fill="#333333">figure), or higher?</text>
  <!-- Arrow -->
  <line x1="310" y1="160" x2="410" y2="160" stroke="#2b6cb0" stroke-width="2"/>
  <polygon points="408,154 408,166 420,160" fill="#2b6cb0"/>
  <text x="365" y="145" text-anchor="middle" font-size="12" fill="#333333">random sample</text>
  <!-- Sample -->
  <circle cx="510" cy="160" r="85" fill="#7cb2e8" stroke="#2b6cb0" stroke-width="2"/>
  <text x="510" y="140" text-anchor="middle" font-size="14" font-weight="bold" fill="#333333">Sample</text>
  <text x="510" y="163" text-anchor="middle" font-size="13" fill="#333333">n = 100 students</text>
  <text x="510" y="185" text-anchor="middle" font-size="13" fill="#333333">19 use marijuana</text>
</svg>
