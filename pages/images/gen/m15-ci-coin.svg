<svg viewBox="0 0 640 160" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <!-- Number line from .40 to .80: x = 60 + (v-.40)*1300 -->
  <line x1="60" y1="100" x2="580" y2="100" stroke="#333333" stroke-width="1.5"/>
  <line x1="60" y1="95" x2="60" y2="105" stroke="#333333" stroke-width="1"/>
  <text x="60" y="125" text-anchor="middle" font-size="13" fill="#333333">0.40</text>
  <line x1="320" y1="95" x2="320" y2="105" stroke="#333333" stroke-width="1"/>
  <text x="320" y="125" text-anchor="middle" font-size="13" fill="#333333">0.60</text>
  <line x1="580" y1="95" x2="580" y2="105" stroke="#333333" stroke-width="1"/>
  <text x="580" y="125" text-anchor="middle" font-size="13" fill="#333333">0.80</text>
  <!-- CI bar: .49 -> x=177 ; .71 -> x=463 -->
  <line x1="177" y1="70" x2="463" y2="70" stroke="#2b6cb0" stroke-width="6" stroke-linecap="round"/>
  <line x1="177" y1="95" x2="177" y2="105" stroke="#2b6cb0" stroke-width="2"/>
  <text x="177" y="125" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6cb0">0.49</text>
  <line x1="463" y1="95" x2="463" y2="105" stroke="#2b6cb0" stroke-width="2"/>
  <text x="463" y="125" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6cb0">0.71</text>
  <text x="320" y="55" text-anchor="middle" font-size="13" fill="#2b6cb0">95% confidence interval for p</text>
  <!-- p0 = .5 -> x=190 -->
  <circle cx="190" cy="100" r="6" fill="#2f855a"/>
  <text x="220" y="150" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f855a">p&#8320; = 0.5 (inside &#8594; cannot reject H&#8320;)</text>
</svg>
