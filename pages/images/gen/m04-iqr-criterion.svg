<svg viewBox="0 0 640 200" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" fill="#333333">
  <!-- outlier zones -->
  <rect x="40" y="100" width="100" height="20" fill="#c53030" fill-opacity="0.35"/>
  <rect x="500" y="100" width="100" height="20" fill="#c53030" fill-opacity="0.35"/>
  <!-- normal zone line -->
  <line x1="40" y1="110" x2="600" y2="110" stroke="#333333" stroke-width="3"/>
  <!-- markers -->
  <g stroke="#333333" stroke-width="2">
    <line x1="240" y1="95" x2="240" y2="125"/>
    <line x1="320" y1="95" x2="320" y2="125"/>
    <line x1="400" y1="95" x2="400" y2="125"/>
  </g>
  <g stroke="#c53030" stroke-width="2.5">
    <line x1="140" y1="90" x2="140" y2="130"/>
    <line x1="500" y1="90" x2="500" y2="130"/>
  </g>
  <g font-size="14" font-weight="bold" text-anchor="middle">
    <text x="240" y="85">Q1</text>
    <text x="320" y="85">M</text>
    <text x="400" y="85">Q3</text>
  </g>
  <g font-size="13" font-weight="bold" text-anchor="middle" fill="#c53030">
    <text x="140" y="55">Q1 &#8722; 1.5(IQR)</text>
    <text x="500" y="55">Q3 + 1.5(IQR)</text>
  </g>
  <g stroke="#c53030" stroke-width="1.5">
    <line x1="140" y1="62" x2="140" y2="84"/>
    <line x1="500" y1="62" x2="500" y2="84"/>
  </g>
  <g font-size="13" text-anchor="middle" fill="#c53030">
    <text x="90" y="150">suspected</text><text x="90" y="166">outliers</text>
    <text x="550" y="150">suspected</text><text x="550" y="166">outliers</text>
  </g>
</svg>
