    <text x="320" y="121" text-anchor="middle" font-size="12" font-weight="bold" fill="#dd6b20">Gasoline B</text>
    <rect x="265" y="145" width="110" height="32" rx="7" fill="#e6f4ea" stroke="#2f855a" stroke-width="1.5"/>
    <text x="320" y="166" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f855a">Gasoline A</text>
  </g>
  <g>
    <rect x="430" y="50" width="150" height="150" rx="12" fill="#eaf2fb" stroke="#2b6cb0" stroke-width="2"/>
    <text x="505" y="80" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6cb0">Car n</text>
    <rect x="450" y="100" width="110" height="32" rx="7" fill="#e6f4ea" stroke="#2f855a" stroke-width="1.5"/>
