    <rect x="80" y="145" width="110" height="32" rx="7" fill="#fdebd9" stroke="#dd6b20" stroke-width="1.5"/>
    <text x="135" y="166" text-anchor="middle" font-size="12" font-weight="bold" fill="#dd6b20">Gasoline B</text>
  </g>
  <g>
    <rect x="245" y="50" width="150" height="150" rx="12" fill="#eaf2fb" stroke="#2b6cb0" stroke-width="2"/>
