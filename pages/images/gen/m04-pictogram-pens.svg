<svg viewBox="0 0 640 380" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" fill="#333333">
  <text x="320" y="26" text-anchor="middle" font-size="18" font-weight="bold">Advertising Spending by Magazine (a misleading pictogram)</text>
  <!-- Time pen -->
  <text x="160" y="66" text-anchor="middle" font-size="14" font-weight="bold">$4,433,879</text>
  <rect x="130" y="80" width="60" height="210" rx="8" fill="#7cb2e8" stroke="#2b6cb0" stroke-width="2"/>
  <polygon points="130,290 190,290 160,320" fill="#2b6cb0"/>
  <text x="160" y="345" text-anchor="middle" font-size="15" font-weight="bold">Time</text>
  <!-- Newsweek pen -->
  <text x="340" y="160" text-anchor="middle" font-size="14" font-weight="bold">$2,698,386</text>
  <rect x="322" y="174" width="36" height="128" rx="6" fill="#7cb2e8" stroke="#2b6cb0" stroke-width="2"/>
  <polygon points="322,302 358,302 340,320" fill="#2b6cb0"/>
  <text x="340" y="345" text-anchor="middle" font-size="15" font-weight="bold">Newsweek</text>
  <!-- U.S. News pen -->
  <text x="480" y="223" text-anchor="middle" font-size="14" font-weight="bold">$1,537,617</text>
  <rect x="469" y="237" width="22" height="73" rx="4" fill="#7cb2e8" stroke="#2b6cb0" stroke-width="2"/>
  <polygon points="469,310 491,310 480,320" fill="#2b6cb0"/>
  <text x="480" y="345" text-anchor="middle" font-size="15" font-weight="bold">U.S. News</text>
  <line x1="80" y1="320" x2="560" y2="320" stroke="#333333" stroke-width="1.5"/>
</svg>
