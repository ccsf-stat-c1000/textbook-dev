<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <!-- Normal curve -->
  <polyline points="110,238 127.5,235.9 145,232.1 162.5,225.7 180,215.6 197.5,201.1 215,181.6 232.5,157.6 250,130.8 267.5,104.1 285,81.2 302.5,65.5 320,60 337.5,65.5 355,81.2 372.5,104.1 390,130.8 407.5,157.6 425,181.6 442.5,201.1 460,215.6 477.5,225.7 495,232.1 512.5,235.9 530,238" fill="none" stroke="#2b6cb0" stroke-width="2.5"/>
  <!-- Baseline -->
  <line x1="90" y1="240" x2="550" y2="240" stroke="#333333" stroke-width="1.5"/>
  <!-- Center p0 -->
  <line x1="320" y1="60" x2="320" y2="240" stroke="#999999" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="320" y="260" text-anchor="middle" font-size="15" font-weight="bold" fill="#333333">p&#8320;</text>
  <!-- p-hat value -->
  <line x1="440" y1="185" x2="440" y2="240" stroke="#c53030" stroke-width="2"/>
  <text x="440" y="260" text-anchor="middle" font-size="15" font-weight="bold" fill="#c53030">p&#770;</text>
  <!-- z distance -->
  <line x1="320" y1="285" x2="440" y2="285" stroke="#2f855a" stroke-width="2"/>
  <polygon points="434,280 434,290 444,285" fill="#2f855a"/>
  <polygon points="326,280 326,290 316,285" fill="#2f855a"/>
  <text x="380" y="278" text-anchor="middle" font-size="13" fill="#2f855a">z = number of standard deviations</text>
  <!-- Title -->
  <text x="320" y="30" text-anchor="middle" font-size="14" font-weight="bold" fill="#333333">Sampling distribution of p&#770; when H&#8320; is true (p = p&#8320;)</text>
  <text x="150" y="120" font-size="13" fill="#333333">standard deviation:</text>
  <text x="150" y="140" font-size="13" fill="#333333">&#8730;(p&#8320;(1&#8722;p&#8320;)/n)</text>
</svg>
