<svg viewBox="0 0 640 340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" fill="#333333">
  <text x="320" y="24" text-anchor="middle" font-size="16" font-weight="bold">Probability Histogram: P(X = x) = (x + 2)/25</text>
  <g fill="#7cb2e8" stroke="#2b6cb0" stroke-width="1">
    <rect x="80" y="208" width="80" height="72"/>
    <rect x="160" y="184" width="80" height="96"/>
    <rect x="240" y="160" width="80" height="120"/>
    <rect x="320" y="136" width="80" height="144"/>
    <rect x="400" y="112" width="80" height="168"/>
  </g>
  <g font-size="13" text-anchor="middle" font-weight="bold">
    <text x="120" y="200">3/25</text><text x="200" y="176">4/25</text><text x="280" y="152">5/25</text>
    <text x="360" y="128">6/25</text><text x="440" y="104">7/25</text>
  </g>
  <line x1="60" y1="280" x2="520" y2="280" stroke="#333333" stroke-width="1.5"/>
  <g font-size="14" text-anchor="middle">
    <text x="120" y="300">1</text><text x="200" y="300">2</text><text x="280" y="300">3</text>
    <text x="360" y="300">4</text><text x="440" y="300">5</text>
  </g>
  <text x="290" y="328" font-size="15" text-anchor="middle">x</text>
  <text x="24" y="170" font-size="14" text-anchor="middle" transform="rotate(-90 24 170)">Probability</text>
</svg>
