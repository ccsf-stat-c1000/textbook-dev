<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" fill="#333333">
  <text x="320" y="24" text-anchor="middle" font-size="15" font-weight="bold">Multiplying by a Constant Stretches or Shrinks the Spread</text>
  <!-- Original X -->
  <g fill="#7cb2e8" stroke="#2b6cb0" stroke-width="1">
    <rect x="61" y="180" width="16" height="20"/><rect x="79" y="180" width="16" height="20"/>
    <rect x="97" y="80" width="16" height="120"/><rect x="115" y="180" width="16" height="20"/>
    <rect x="133" y="180" width="16" height="20"/>
  </g>
  <line x1="40" y1="200" x2="170" y2="200" stroke="#333333" stroke-width="1.5"/>
  <g font-size="11" text-anchor="middle">
    <text x="69" y="215">-2</text><text x="105" y="215">0</text><text x="141" y="215">2</text>
  </g>
  <text x="105" y="240" text-anchor="middle" font-size="13" font-weight="bold">X: &#963; = 1</text>
  <!-- 4X -->
  <g fill="#2f855a" fill-opacity="0.55" stroke="#2f855a" stroke-width="1">
    <rect x="224" y="180" width="16" height="20"/><rect x="268" y="180" width="16" height="20"/>
    <rect x="312" y="80" width="16" height="120"/><rect x="356" y="180" width="16" height="20"/>
    <rect x="400" y="180" width="16" height="20"/>
  </g>
  <line x1="210" y1="200" x2="430" y2="200" stroke="#333333" stroke-width="1.5"/>
  <g font-size="11" text-anchor="middle">
    <text x="232" y="215">-8</text><text x="320" y="215">0</text><text x="408" y="215">8</text>
  </g>
  <text x="320" y="240" text-anchor="middle" font-size="13" font-weight="bold">4X: &#963; = 4</text>
  <!-- X/4 -->
  <g fill="#dd6b20" fill-opacity="0.55" stroke="#dd6b20" stroke-width="1">
    <rect x="491" y="180" width="16" height="20"/><rect x="509" y="180" width="16" height="20"/>
    <rect x="527" y="80" width="16" height="120"/><rect x="545" y="180" width="16" height="20"/>
    <rect x="563" y="180" width="16" height="20"/>
  </g>
  <line x1="480" y1="200" x2="590" y2="200" stroke="#333333" stroke-width="1.5"/>
  <g font-size="11" text-anchor="middle">
    <text x="499" y="215">-0.5</text><text x="535" y="215">0</text><text x="571" y="215">0.5</text>
  </g>
  <text x="535" y="240" text-anchor="middle" font-size="13" font-weight="bold">X/4: &#963; = 1/4</text>
</svg>
