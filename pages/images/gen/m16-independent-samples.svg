  <text x="150" y="212" text-anchor="middle" font-size="13" font-weight="bold" fill="#333333">Sub-population 2</text>
  <text x="150" y="232" text-anchor="middle" font-size="13" fill="#333333">mean of Y: &#956;&#8322;</text>
  <!-- Arrows -->
  <line x1="278" y1="80" x2="390" y2="80" stroke="#2b6cb0" stroke-width="2"/>
  <polygon points="388,74 388,86 400,80" fill="#2b6cb0"/>
