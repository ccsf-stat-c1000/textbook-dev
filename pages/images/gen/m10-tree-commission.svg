<svg viewBox="0 0 640 330" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" fill="#333333">
  <text x="320" y="24" text-anchor="middle" font-size="15" font-weight="bold">Probability Tree: Commission (C), then Vacation (V)</text>
  <circle cx="70" cy="170" r="6" fill="#333333"/>
  <g stroke="#2b6cb0" stroke-width="2" fill="none">
    <line x1="70" y1="170" x2="240" y2="95"/>
    <line x1="70" y1="170" x2="240" y2="245"/>
    <line x1="240" y1="95" x2="410" y2="60"/>
    <line x1="240" y1="95" x2="410" y2="130"/>
    <line x1="240" y1="245" x2="410" y2="210"/>
    <line x1="240" y1="245" x2="410" y2="280"/>
  </g>
  <circle cx="240" cy="95" r="5" fill="#2b6cb0"/>
  <circle cx="240" cy="245" r="5" fill="#2b6cb0"/>
  <g font-size="13" font-weight="bold">
    <text x="140" y="115">C: 0.4</text>
    <text x="130" y="228">not C: 0.6</text>
    <text x="300" y="62">V | C: 0.9</text>
    <text x="295" y="130">not V | C: 0.1</text>
    <text x="290" y="212">V | not C: 0.3</text>
    <text x="285" y="282">not V | not C: 0.7</text>
  </g>
  <g font-size="13">
    <text x="425" y="64">P(C and V) = 0.4 &#215; 0.9 = <tspan font-weight="bold" fill="#c53030">0.36</tspan></text>
    <text x="425" y="134">P(C and not V) = 0.04</text>
    <text x="425" y="214">P(not C and V) = 0.6 &#215; 0.3 = <tspan font-weight="bold" fill="#c53030">0.18</tspan></text>
    <text x="425" y="284">P(not C and not V) = 0.42</text>
  </g>
  <text x="320" y="318" text-anchor="middle" font-size="13" font-style="italic" fill="#c53030">P(V) = 0.36 + 0.18 = 0.54</text>
</svg>
