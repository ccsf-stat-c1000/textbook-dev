<svg viewBox="0 0 640 240" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" fill="#333333">
  <text x="320" y="30" text-anchor="middle" font-size="17" font-weight="bold">Structure of a Confidence Interval</text>
  <text x="320" y="80" text-anchor="middle" font-size="22">x&#772; &#160;&#177;&#160; z* &#183; &#963;/&#8730;n</text>
  <g stroke="#666666" stroke-width="1.5">
    <line x1="215" y1="92" x2="215" y2="120"/>
    <line x1="392" y1="92" x2="352" y2="120"/>
  </g>
  <text x="215" y="140" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b6cb0">point estimate</text>
  <text x="380" y="140" text-anchor="middle" font-size="14" font-weight="bold" fill="#c53030">margin of error m</text>
  <text x="380" y="160" text-anchor="middle" font-size="13" fill="#c53030">= confidence multiplier &#215; SD of the estimator</text>
  <!-- interval diagram -->
  <line x1="140" y1="205" x2="500" y2="205" stroke="#333333" stroke-width="2"/>
  <line x1="140" y1="195" x2="140" y2="215" stroke="#2f855a" stroke-width="2.5"/>
  <line x1="500" y1="195" x2="500" y2="215" stroke="#2f855a" stroke-width="2.5"/>
  <circle cx="320" cy="205" r="6" fill="#2b6cb0"/>
  <text x="320" y="232" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b6cb0">estimate</text>
  <text x="230" y="196" text-anchor="middle" font-size="13" fill="#c53030">m</text>
  <text x="410" y="196" text-anchor="middle" font-size="13" fill="#c53030">m</text>
</svg>
