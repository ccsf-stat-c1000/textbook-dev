<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <!-- Population -->
  <circle cx="185" cy="160" r="120" fill="#7cb2e8" fill-opacity="0.35" stroke="#2b6cb0" stroke-width="2"/>
  <text x="185" y="90" text-anchor="middle" font-size="14" font-weight="bold" fill="#333333">Population</text>
  <text x="185" y="110" text-anchor="middle" font-size="13" fill="#333333">All U.S. adults</text>
  <text x="185" y="150" text-anchor="middle" font-size="13" fill="#c53030">p = proportion who support</text>
  <text x="185" y="167" text-anchor="middle" font-size="13" fill="#c53030">the death penalty</text>
  <text x="185" y="200" text-anchor="middle" font-size="13" font-style="italic" fill="#333333">Has p changed since 2003</text>
  <text x="185" y="217" text-anchor="middle" font-size="13" font-style="italic" fill="#333333">(when it was 0.64)?</text>
  <!-- Arrow -->
  <line x1="310" y1="160" x2="410" y2="160" stroke="#2b6cb0" stroke-width="2"/>
  <polygon points="408,154 408,166 420,160" fill="#2b6cb0"/>
  <text x="365" y="145" text-anchor="middle" font-size="12" fill="#333333">random sample</text>
  <!-- Sample -->
  <circle cx="510" cy="160" r="85" fill="#7cb2e8" stroke="#2b6cb0" stroke-width="2"/>
  <text x="510" y="130" text-anchor="middle" font-size="14" font-weight="bold" fill="#333333">Sample</text>
  <text x="510" y="153" text-anchor="middle" font-size="13" fill="#333333">n = 1,000 U.S. adults</text>
  <text x="510" y="173" text-anchor="middle" font-size="13" fill="#333333">675 in favor</text>
  <text x="510" y="198" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f855a">p&#770; = 675/1000 = 0.675</text>
</svg>
