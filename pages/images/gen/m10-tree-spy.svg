<svg viewBox="0 0 640 330" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" fill="#333333">
  <text x="320" y="24" text-anchor="middle" font-size="15" font-weight="bold">Probability Tree: Spy (S), then Detected (D)</text>
  <circle cx="70" cy="170" r="6" fill="#333333"/>
  <g stroke="#2b6cb0" stroke-width="2" fill="none">
    <line x1="70" y1="170" x2="240" y2="95"/>
    <line x1="70" y1="170" x2="240" y2="245"/>
    <line x1="240" y1="95" x2="410" y2="60"/>
    <line x1="240" y1="95" x2="410" y2="130"/>
    <line x1="240" y1="245" x2="410" y2="210"/>
    <line x1="240" y1="245" x2="410" y2="280"/>
  </g>
  <circle cx="240" cy="95" r="5" fill="#2b6cb0"/>
  <circle cx="240" cy="245" r="5" fill="#2b6cb0"/>
  <g font-size="13" font-weight="bold">
    <text x="125" y="115" fill="#c53030">S: 0.001</text>
    <text x="115" y="228">not S: 0.999</text>
    <text x="290" y="62" fill="#c53030">D | S: 0.80</text>
    <text x="285" y="130">not D | S: 0.20</text>
    <text x="280" y="212" fill="#c53030">D | not S: 0.16</text>
    <text x="275" y="282">not D | not S: 0.84</text>
  </g>
  <g font-size="13">
    <text x="425" y="64">P(S and D) = 0.0008</text>
    <text x="425" y="134">P(S and not D) = 0.0002</text>
    <text x="425" y="214">P(not S and D) = 0.15984</text>
    <text x="425" y="284">P(not S and not D) = 0.83916</text>
  </g>
  <text x="320" y="318" text-anchor="middle" font-size="13" font-style="italic">Probabilities given in the problem are shown in red; the rest follow from the Complement Rule</text>
</svg>
