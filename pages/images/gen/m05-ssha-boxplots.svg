<svg viewBox="0 0 640 380" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" fill="#333333">
  <text x="340" y="26" text-anchor="middle" font-size="16" font-weight="bold">SSHA Scores by Gender (40 students)</text>
  <!-- y axis: 60 to 210 mapped 310 to 60: y = 310 - (v-60)*(250/150) -->
  <line x1="110" y1="60" x2="110" y2="310" stroke="#333333" stroke-width="1.5"/>
  <g stroke="#333333" stroke-width="1.5">
    <line x1="104" y1="293.3" x2="110" y2="293.3"/><line x1="104" y1="243.3" x2="110" y2="243.3"/>
    <line x1="104" y1="193.3" x2="110" y2="193.3"/><line x1="104" y1="143.3" x2="110" y2="143.3"/>
    <line x1="104" y1="93.3" x2="110" y2="93.3"/>
  </g>
  <g font-size="13" text-anchor="end">
    <text x="98" y="298">70</text><text x="98" y="248">100</text><text x="98" y="198">130</text>
    <text x="98" y="148">160</text><text x="98" y="98">190</text>
  </g>
  <text x="46" y="185" font-size="15" text-anchor="middle" transform="rotate(-90 46 185)">SSHA score</text>
  <!-- Female: min103 y=238.3, Q1 128.75 y=195.4, M153 y=155, Q3 163.75 y=137.1, Max200 y=76.7 -->
  <line x1="240" y1="238.3" x2="240" y2="195.4" stroke="#333333" stroke-width="2"/>
  <line x1="215" y1="238.3" x2="265" y2="238.3" stroke="#333333" stroke-width="2"/>
  <rect x="190" y="137.1" width="100" height="58.3" fill="#7cb2e8" fill-opacity="0.55" stroke="#2b6cb0" stroke-width="2"/>
  <line x1="190" y1="155" x2="290" y2="155" stroke="#2b6cb0" stroke-width="3"/>
  <line x1="240" y1="137.1" x2="240" y2="76.7" stroke="#333333" stroke-width="2"/>
  <line x1="215" y1="76.7" x2="265" y2="76.7" stroke="#333333" stroke-width="2"/>
  <text x="240" y="340" text-anchor="middle" font-size="15" font-weight="bold">Female</text>
  <!-- Male: min70 y=293.3, Q1 95 y=251.7, M114.5 y=219.2, Q3 144.5 y=169.2, Max187 y=98.3 -->
  <line x1="460" y1="293.3" x2="460" y2="251.7" stroke="#333333" stroke-width="2"/>
  <line x1="435" y1="293.3" x2="485" y2="293.3" stroke="#333333" stroke-width="2"/>
  <rect x="410" y="169.2" width="100" height="82.5" fill="#2f855a" fill-opacity="0.35" stroke="#2f855a" stroke-width="2"/>
  <line x1="410" y1="219.2" x2="510" y2="219.2" stroke="#2f855a" stroke-width="3"/>
  <line x1="460" y1="169.2" x2="460" y2="98.3" stroke="#333333" stroke-width="2"/>
  <line x1="435" y1="98.3" x2="485" y2="98.3" stroke="#333333" stroke-width="2"/>
  <text x="460" y="340" text-anchor="middle" font-size="15" font-weight="bold">Male</text>
</svg>
