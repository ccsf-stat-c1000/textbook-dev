<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" fill="#333333">
  <rect x="30" y="30" width="580" height="260" fill="none" stroke="#333333" stroke-width="2"/>
  <text x="45" y="55" font-size="17" font-weight="bold">S</text>
  <!-- Event A -->
  <circle cx="130" cy="160" r="60" fill="#c53030" fill-opacity="0.12" stroke="#c53030" stroke-width="2"/>
  <text x="130" y="112" text-anchor="middle" font-size="15" font-weight="bold" fill="#c53030">A</text>
  <text x="130" y="167" text-anchor="middle" font-size="15" font-family="Courier New, monospace">TTT</text>
  <!-- Event C (large) -->
  <ellipse cx="420" cy="160" rx="175" ry="115" fill="#2b6cb0" fill-opacity="0.10" stroke="#2b6cb0" stroke-width="2"/>
  <text x="420" y="65" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b6cb0">C</text>
  <!-- Event B inside C -->
  <ellipse cx="360" cy="185" rx="85" ry="55" fill="#2f855a" fill-opacity="0.15" stroke="#2f855a" stroke-width="2"/>
  <text x="300" y="150" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f855a">B</text>
  <g font-size="14" font-family="Courier New, monospace" text-anchor="middle">
    <text x="330" y="180">HTT</text>
    <text x="390" y="180">THT</text>
    <text x="360" y="210">TTH</text>
    <text x="450" y="105">HHH</text>
    <text x="520" y="130">THH</text>
    <text x="520" y="180">HTH</text>
    <text x="490" y="225">HHT</text>
  </g>
  <text x="320" y="312" text-anchor="middle" font-size="13" font-style="italic">A: no heads &#8226; B: exactly one head &#8226; C: at least one head (B is contained in C)</text>
</svg>
