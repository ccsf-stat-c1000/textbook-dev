<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" fill="#333333">
  <text x="320" y="24" text-anchor="middle" font-size="15" font-weight="bold">P(A or B) = P(A) + P(B) &#8722; P(A and B)</text>
  <!-- Panel 1: P(A) -->
  <rect x="20" y="45" width="180" height="120" fill="none" stroke="#333333" stroke-width="1.5"/>
  <circle cx="85" cy="105" r="42" fill="#7cb2e8" fill-opacity="0.8" stroke="#2b6cb0" stroke-width="1.5"/>
  <circle cx="140" cy="105" r="42" fill="none" stroke="#2f855a" stroke-width="1.5"/>
  <text x="110" y="190" text-anchor="middle" font-size="14" font-weight="bold">P(A)</text>
  <text x="222" y="112" text-anchor="middle" font-size="22" font-weight="bold">+</text>
  <!-- Panel 2: P(B) -->
  <rect x="240" y="45" width="180" height="120" fill="none" stroke="#333333" stroke-width="1.5"/>
  <circle cx="305" cy="105" r="42" fill="none" stroke="#2b6cb0" stroke-width="1.5"/>
  <circle cx="360" cy="105" r="42" fill="#2f855a" fill-opacity="0.6" stroke="#2f855a" stroke-width="1.5"/>
  <text x="330" y="190" text-anchor="middle" font-size="14" font-weight="bold">P(B)</text>
  <text x="442" y="112" text-anchor="middle" font-size="22" font-weight="bold">&#8722;</text>
  <!-- Panel 3: P(A and B) -->
  <rect x="455" y="45" width="180" height="120" fill="none" stroke="#333333" stroke-width="1.5"/>
  <defs>
    <clipPath id="clipA3"><circle cx="520" cy="105" r="42"/></clipPath>
  </defs>
  <circle cx="520" cy="105" r="42" fill="none" stroke="#2b6cb0" stroke-width="1.5"/>
  <circle cx="575" cy="105" r="42" fill="none" stroke="#2f855a" stroke-width="1.5"/>
  <circle cx="575" cy="105" r="42" fill="#c53030" fill-opacity="0.8" clip-path="url(#clipA3)"/>
  <text x="545" y="190" text-anchor="middle" font-size="14" font-weight="bold">P(A and B)</text>
  <text x="320" y="235" text-anchor="middle" font-size="13" font-style="italic">The overlap is counted twice when adding, so subtract it once</text>
</svg>
